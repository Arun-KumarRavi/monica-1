version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - .:/var/www/html
    environment:
      - ESPOCRM_DATABASE_HOST=db
      - ESPOCRM_DATABASE_USER=root
      - ESPOCRM_DATABASE_PASSWORD=root
      - ESPOCRM_DATABASE_NAME=espocrm
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - backend

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: espocrm
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  cron:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - .:/var/www/html
    command: >
      sh -c "while true; do php cron.php; sleep 60; done"
    depends_on:
      - db
      - backend

volumes:
  db-data:
